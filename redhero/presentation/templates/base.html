<!doctype html>
<html lang="pl" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RedHero{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand bg-danger" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'home' %}">RedHero</a>
      <div class="navbar-nav ms-auto">
        {% if user.is_authenticated %}
          <span class="navbar-text">{{ user.email }}</span>
        {% else %}
          <a class="nav-link" href="{% url 'register' %}">Zarejestruj się</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}" role="alert">
        {{ message }}
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
